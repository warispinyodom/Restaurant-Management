{% extends 'base.html' %}
{% block content %}
<h2>Dashboard <span class="badge bg-primary fs-6">{{ role }}</span></h2>
<p>ยินดีต้อนรับ, {{ username }}</p>

<div class="row mt-4">
    <div class="col-md-4">
        <div class="card text-white bg-success mb-3">
            <div class="card-body">
                <h5 class="card-title">ยอดขายวันนี้</h5>
                <h3 id="sales-today">฿0.00</h3>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-info mb-3">
            <div class="card-body">
                <h5 class="card-title">ลูกค้าวันนี้</h5>
                <h3 id="customers-today">0 คน</h3>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-white bg-warning mb-3">
            <div class="card-body">
                <h5 class="card-title">พนักงานที่ปฏิบัติงาน</h5>
                <h3 id="active-staff">0 คน</h3>
            </div>
        </div>
    </div>
</div>

<div class="card mt-4">
    <div class="card-body">
        <canvas id="salesChart" height="100"></canvas>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const userRole = "{{ role }}";
    
    if (userRole === 'admin') {
        function fetchDashboardStats() {
            fetch('/api/admin/dashboard_stats')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('sales-today').innerText = '฿' + data.sales_today.toLocaleString('th-TH', {minimumFractionDigits: 2});
                    document.getElementById('customers-today').innerText = data.customers_today.toLocaleString('th-TH') + ' คน';
                    document.getElementById('active-staff').innerText = data.active_staff.toLocaleString('th-TH') + ' คน';
                })
                .catch(err => console.error(err));
        }
        fetchDashboardStats();
        setInterval(fetchDashboardStats, 10000); // อัปเดตทุก 10 วินาที
    }

    // ตัวอย่างกราฟ (Chart.js)
    const ctx = document.getElementById('salesChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัสฯ', 'ศุกร์', 'เสาร์', 'อาทิตย์'],
            datasets: [{
                label: 'ยอดขายสัปดาห์นี้',
                data: [1200, 1900, 3000, 5000, 2000, 3000, 4500],
                borderColor: 'blue',
                tension: 0.1
            }]
        }
    });
</script>
{% endblock %}
