{% extends 'base.html' %}
{% block content %}
<h3 class="fw-bold mb-4"><i class="fas fa-chart-bar"></i> แดชบอร์ดสรุปผลผู้บริหาร</h3>

<div class="row g-4 mb-4">
    <div class="col-md-6">
        <div class="card bg-success text-white shadow">
            <div class="card-body p-4">
                <h5 class="card-title"><i class="fas fa-coins"></i> ยอดขายรวมทั้งหมด (ที่ชำระแล้ว)</h5>
                <h2 class="display-5 fw-bold">{{ "%.2f"|format(total_sales) }} บาท</h2>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card bg-primary text-white shadow">
            <div class="card-body p-4">
                <h5 class="card-title"><i class="fas fa-check-circle"></i> จำนวนออเดอร์ที่สำเร็จแล้ว</h5>
                <h2 class="display-5 fw-bold">{{ paid_count }} ออเดอร์</h2>
            </div>
        </div>
    </div>
</div>
{% endblock %}
